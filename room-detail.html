<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta name="theme-color" content="#286192">
  <title>Listing Details | PIXON REAL ESTATE</title>

  <!-- CSS FILES -->
  <link rel="stylesheet" href="css/lineicons.css">
  <link rel="stylesheet" href="css/fancybox.min.css">
  <link rel="stylesheet" href="css/swiper.min.css">
  <link rel="stylesheet" href="css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/boxicons/2.1.0/css/boxicons.min.css">

  <style>
    /* HERO SECTION REDESIGN */
    .property-hero-wrapper {
      display: flex;
      gap: 30px;
      margin-top: 40px;
      align-items: flex-start;
    }

    .property-main-hero {
      flex: 0 0 70%;
      width: 70%;
      border-radius: 0;
      overflow: hidden;
      position: relative;
      border: 1px solid #eee;
    }

    .property-sidebar-hero {
      flex: 0 0 30%;
      width: 30%;
      position: sticky;
      top: 100px;
    }

    .property-hero-slider {
      width: 100%;
      height: 600px;
    }

    .property-hero-slider img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .swiper-button-next,
    .swiper-button-prev {
      color: #fff;
      background: rgba(0, 0, 0, 0.3);
      width: 50px;
      height: 50px;
      border-radius: 50%;
      backdrop-filter: blur(5px);
    }

    .swiper-button-next::after,
    .swiper-button-prev::after {
      font-size: 20px;
    }

    @media (max-width: 991px) {
      .property-hero-wrapper {
        flex-direction: column;
      }

      .property-main-hero,
      .property-sidebar-hero {
        flex: 0 0 100%;
        width: 100%;
      }

      .property-sidebar-hero {
        position: static;
        margin-top: 20px;
      }

      .property-hero-slider {
        height: 400px;
      }
    }
  </style>
</head>

<body>
  <div class="preloader">
    <div class="loadbar"></div>
    <figure><img src="images/pixon-logo.jpeg" alt="Image"></figure>
  </div>

  <special-header></special-header>

  <main id="main">
    <section class="content-section" style="padding-top: 100px; padding-bottom: 60px;">
      <div class="container-fluid" style="max-width: 1400px; margin: 0 auto; padding: 0 30px;">

        <!-- Top Info -->
        <div class="property-top-info" style="margin-bottom: 25px;">
          <h1 id="propTitle" style="font-size: 36px; font-weight: 700; margin-bottom: 10px;">Loading...</h1>
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <p id="propLocation" style="margin: 0; color: #717171; font-size: 16px;">
              <i class="bx bx-map" style="color: #286192;"></i> Kampala, Uganda
            </p>
            <div style="display: flex; gap: 20px;">
              <button id="shareBtn"
                style="background: none; border: none; text-decoration: underline; font-weight: 600; cursor: pointer;"><i
                  class="bx bx-share-alt"></i> Share</button>
            </div>
          </div>
        </div>

        <!-- NEW HERO LAYOUT (70:30) -->
        <div class="property-hero-wrapper">
          <!-- 70% Slider -->
          <div class="property-main-hero">
            <div class="swiper-container property-hero-slider">
              <div id="propImages" class="swiper-wrapper">
                <div class="swiper-slide"><img src="images/pixon-logo.jpeg" alt="Loading"></div>
              </div>
              <!-- Add Arrows -->
              <div class="swiper-button-next"></div>
              <div class="swiper-button-prev"></div>
              <!-- Add Pagination -->
              <div class="swiper-pagination"></div>
            </div>
        <!-- Secondary Info -->
        <div class="property-details-info" style="margin-top: 60px; ">
          <div class="property-description">
            <h2 style="font-weight: 700; margin-bottom: 25px;">More Details</h2>
            <p id="propDescription" style="font-size: 18px; line-height: 1.7; color: #444;">Loading property description...</p>

            <div class="property-specs-grid" style="margin: 40px 0;">
              <div class="spec-item">
                <i class="bx bx-bed"></i>
                <span>Bedrooms</span>
                <strong id="propBedrooms">...</strong>
              </div>
              <div class="spec-item">
                <i class="bx bx-bath"></i>
                <span>Bathrooms</span>
                <strong id="propBathrooms">...</strong>
              </div>
              <div class="spec-item">
                <i class="bx bx-hotel"></i>
                <span>Type</span>
                <strong id="propType">...</strong>
              </div>
              <div class="spec-item">
                <i class="bx bx-shield-check"></i>
                <span>Security</span>
                <strong id="propSecurity">Level 5</strong>
              </div>
            </div>

            <h3 style="font-weight: 700; margin-top: 40px;">Top Amenities</h3>
            <div id="propAmenities" class="amenities-grid" style="margin-top: 20px;"></div>
            

          </div>
        </div>
          </div>

      <!-- 30% Booking Card -->
          <div class="property-sidebar-hero">
            <div class="booking-card" style="margin: 0; position: static;">
              <div class="booking-header">
                <div class="price">
                  <span id="propPrice">Loading...</span> <span id="priceUnit">/night</span>
                </div>
                <p id="propStatus">Luxury and security guaranteed</p>
              </div>

              <div class="booking-inputs" style="margin-top: 20px;">
                <div class="input-row">
                  <div class="input-group">
                    <label>Check In</label>
                    <input type="date" id="checkIn" style="width: 100%; height: 55px; padding: 0 20px; border: 1px solid #e5e5e5; background: #fff; font-family: inherit; color: #444;">
                  </div>
                  <div class="input-group">
                    <label>Check Out</label>
                    <input type="date" id="checkOut" style="width: 100%; height: 55px; padding: 0 20px; border: 1px solid #e5e5e5; background: #fff; font-family: inherit; color: #444;">
                  </div>
                </div>
                <div class="input-group" style="margin-top: 15px;">
                  <label>Guests</label>
                  <select>
                    <option>02 Guests</option>
                    <option>01 Guest</option>
                  </select>
                </div>
              </div>

              <div class="user-details-inputs" style="margin-top: 15px;">
                  <div class="input-group" style="margin-bottom: 15px;">
                      <label>Full Name *</label>
                      <input type="text" id="inqName" required placeholder="Your Name" style="width: 100%; height: 55px; padding: 0 20px; border: 1px solid #e5e5e5; background: #fff;">
                  </div>
                  <div class="input-group" style="margin-bottom: 15px;">
                      <label>Phone Number *</label>
                      <input type="tel" id="inqPhone" required placeholder="Your Phone Number" style="width: 100%; height: 55px; padding: 0 20px; border: 1px solid #e5e5e5; background: #fff;">
                  </div>
                  <div class="input-group">
                      <label>Email Address</label>
                      <input type="email" id="inqEmail" placeholder="Your Email (Optional)" style="width: 100%; height: 55px; padding: 0 20px; border: 1px solid #e5e5e5; background: #fff;">
                  </div>
              </div>

              <div class="booking-actions" style="margin-top: 30px;">
                <button id="reserveBtn" class="btn-filled"
                  style="background-color: #286192; height: 55px; font-size: 16px; border-radius: 0; width: 100%;">Reserve This
                  Listing</button>
                <p style="text-align: center; margin-top: 15px; font-size: 14px; color: #717171;">Local agent response:
                  < 1 hour</p>
              </div>

              <div id="bookingBreakdown" class="price-breakdown"
                style="border: none; background: #f9f9f9; padding: 20px; border-radius: 0; margin-top: 25px;">
                <div class="breakdown-item">
                  <span id="breakdownLabel">Total for 9 nights</span>
                  <span id="breakdownSubtotal">shs. 0</span>
                </div>
                <div class="breakdown-total" style="border-top: 1px solid #ddd; padding-top: 15px; margin-top: 10px;">
                  <span>Total Amount Due</span>
                  <span id="breakdownTotal">shs. 0</span>
                </div>
              </div>
            </div>
          </div>
        </div></div>
    </section>

    <special-footer></special-footer>
  </main>

  <!-- JS FILES -->
  <script src="header-footer.js" defer></script>
  <script src="js/jquery.min.js"></script>
  <script src="js/bootstrap.min.js"></script>
  <script src="js/fancybox.min.js"></script>
  <script src="js/swiper.min.js"></script>
  <script src="js/datepicker.min.js"></script>
  <script src="js/smooth-scrollbar.js"></script>
  <script src="js/overscroll.js"></script>
  <script src="js/TweenMax.min.js"></script>
  <script src="js/scripts.js"></script>
  <script type="module" src="js/room-detail.js"></script>

  <script>
    $(document).ready(function () {
      // Swiper is now initialized inside js/room-detail.js after images are loaded
    });
  </script>
</body>

</html>
