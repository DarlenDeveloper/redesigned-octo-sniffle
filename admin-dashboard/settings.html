<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="googlebot" content="noindex, nofollow">
  <title>Settings | Pixon Admin</title>
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin-dashboard/admin.css">
  <style>
    .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 18px; }
    .form-group.full { grid-column: 1 / -1; }
    label { font-size: 13px; font-weight: 500; color: #1a2332; }
    input, select {
      border: 1px solid #e2e8f0; border-radius: 8px; padding: 11px 14px;
      font-size: 14px; font-family: inherit; color: #1a2332; outline: none;
      transition: border-color 0.2s; background: #fff;
    }
    input:focus { border-color: #286192; }
    .section-title { font-size: 15px; font-weight: 600; margin-bottom: 18px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
    .danger-zone { border: 1px solid #fdecea; border-radius: var(--radius); padding: 22px; margin-top: 20px; }
    .danger-zone .section-title { color: var(--red); border-color: #fdecea; }
    .btn-danger { background: var(--red); color: #fff; border: none; padding: 11px 20px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; }
    .success-msg { background: #e8f8f0; color: #27ae60; border-radius: 8px; padding: 12px 16px; font-size: 14px; margin-bottom: 16px; display: none; }
    @media (max-width: 768px) { .settings-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <img src="../images/pixon-logo.jpeg" alt="Pixon">
      <span>Pixon</span>
    </div>
    <nav class="sidebar-nav">
      <a href="/admin-dashboard/index.html" class="nav-item"><i class='bx bxs-dashboard'></i><span>Dashboard</span></a>
      <a href="/admin-dashboard/properties.html" class="nav-item"><i class='bx bxs-buildings'></i><span>Listings</span></a>
      <a href="/admin-dashboard/inquiries.html" class="nav-item"><i class='bx bxs-inbox'></i><span>Inquiries</span></a>
      <a href="/admin-dashboard/add-property.html" class="nav-item"><i class='bx bxs-plus-circle'></i><span>Add Listing</span></a>
      <a href="/admin-dashboard/settings.html" class="nav-item active"><i class='bx bxs-cog'></i><span>Settings</span></a>
    </nav>
    <div class="sidebar-bottom">
      <a href="../index.html" class="nav-item"><i class='bx bx-globe'></i><span>View Site</span></a>
      <a href="#" class="nav-item" id="logoutBtn"><i class='bx bx-log-out'></i><span>Logout</span></a>
    </div>
  </aside>

  <div class="main-wrapper">
    <header class="topbar">
      <div class="topbar-left">
        <button class="menu-toggle" id="menuToggle"><i class='bx bx-menu'></i></button>
        <div>
          <p class="topbar-sub">PIXON REAL ESTATE</p>
          <h2 class="topbar-title">Settings</h2>
        </div>
      </div>
      <div class="topbar-right">
        <div class="admin-profile">
          <div class="avatar"><i class='bx bxs-user'></i></div>
          <div><p class="admin-name" id="adminEmail">Admin</p><p class="admin-role">Property Manager</p></div>
        </div>
      </div>
    </header>

    <main class="content">
      <div style="max-width: 700px;">

        <!-- Change Password -->
        <div class="card">
          <div class="section-title">Change Password</div>
          <div class="success-msg" id="pwSuccess">Password updated successfully.</div>
          <div class="form-group">
            <label>New Password</label>
            <input type="password" id="newPassword" placeholder="Min. 6 characters">
          </div>
          <div class="form-group">
            <label>Confirm New Password</label>
            <input type="password" id="confirmPassword" placeholder="Repeat password">
          </div>
          <button class="btn-primary" id="updatePwBtn">Update Password</button>
        </div>

        <!-- Danger Zone -->
        <div class="danger-zone">
          <div class="section-title">Danger Zone</div>
          <p style="font-size:14px;color:var(--text-muted);margin-bottom:16px;">Logging out will end your current session immediately.</p>
          <button class="btn-danger" id="logoutDangerBtn">Log Out Now</button>
        </div>

      </div>
    </main>
  </div>

  <script type="module" src="/admin-dashboard/settings.js"></script>
</body>
</html>
