<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="googlebot" content="noindex, nofollow">
  <title>Listings | Pixon Admin</title>
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin-dashboard/admin.css">
  <style>
    .filter-bar { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }
    .filter-btn {
      padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--white); font-size: 13px; font-weight: 500; cursor: pointer;
      font-family: inherit; color: var(--text-muted); transition: all 0.2s;
    }
    .filter-btn.active { background: var(--blue); color: #fff; border-color: var(--blue); }
    .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
    .empty-state i { font-size: 48px; margin-bottom: 12px; display: block; }
  </style>
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <img src="../images/pixon-logo.jpeg" alt="Pixon">
      <span>Pixon</span>
    </div>
    <nav class="sidebar-nav">
      <a href="/admin-dashboard/index.html" class="nav-item"><i class='bx bxs-dashboard'></i><span>Dashboard</span></a>
      <a href="/admin-dashboard/properties.html" class="nav-item active"><i class='bx bxs-buildings'></i><span>Listings</span></a>
      <a href="/admin-dashboard/bookings.html" class="nav-item"><i class='bx bx-calendar'></i><span>Bookings</span></a>
      <a href="/admin-dashboard/inquiries.html" class="nav-item"><i class='bx bxs-inbox'></i><span>Inquiries</span></a>
      <a href="/admin-dashboard/add-property.html" class="nav-item"><i class='bx bxs-plus-circle'></i><span>Add Property</span></a>
      <a href="/admin-dashboard/settings.html" class="nav-item"><i class='bx bxs-cog'></i><span>Settings</span></a>
    </nav>
    <div class="sidebar-bottom">
      <a href="../index.html" class="nav-item"><i class='bx bx-globe'></i><span>View Site</span></a>
      <a href="#" class="nav-item" id="logoutBtn"><i class='bx bx-log-out'></i><span>Logout</span></a>
    </div>
  </aside>

  <div class="main-wrapper">
    <header class="topbar">
      <div class="topbar-left">
        <button class="menu-toggle" id="menuToggle"><i class='bx bx-menu'></i></button>
        <div>
          <p class="topbar-sub">PIXON REAL ESTATE</p>
          <h2 class="topbar-title">Listings</h2>
        </div>
      </div>
      <div class="topbar-right">
        <div class="admin-profile">
          <div class="avatar"><i class='bx bxs-user'></i></div>
          <div><p class="admin-name">Admin</p><p class="admin-role">Property Manager</p></div>
        </div>
      </div>
    </header>

    <main class="content">
      <div class="filter-bar">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="buy">For Sale</button>
        <button class="filter-btn" data-filter="rent">For Rent</button>
        <button class="filter-btn" data-filter="book">Short Stay</button>
        <div class="search-box" style="margin-left:auto;">
          <i class='bx bx-search'></i>
          <input type="text" id="propSearch" placeholder="Search listings...">
        </div>
        <a href="add-property.html" class="btn-primary">+ Add New</a>
      </div>

      <div class="card" style="padding:0;">
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>Listing</th>
                <th>Type</th>
                <th>Category</th>
                <th>Location</th>
                <th>Price</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="propertiesTableBody">
              <tr><td colspan="7" class="loading-row">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script type="module" src="/admin-dashboard/properties.js"></script>
  
  <!-- EDIT MODAL -->
  <div id="editModal" class="modal-overlay">
    <div class="modal-container">
      <div class="modal-header">
        <h2>Edit Property</h2>
        <button id="closeModal" class="modal-close">&times;</button>
      </div>
      
      <form id="editForm" class="modal-form">
        <div class="form-grid">
          <div class="form-group full-width">
            <label>Title</label>
            <input type="text" name="title" required placeholder="Enter property title">
          </div>
          
          <div class="form-group">
            <label>Category</label>
            <select name="category" id="editCategory" required>
              <option value="buy">For Sale</option>
              <option value="rent">For Rent</option>
              <option value="book">Short Stay</option>
            </select>
          </div>
          
          <div class="form-group">
            <label>Type</label>
            <select name="type" id="editType" required>
              <option value="Apartment">Apartment</option>
              <option value="House">House</option>
              <option value="Penthouse">Penthouse</option>
              <option value="Villa">Villa</option>
              <option value="Hotel">Hotel</option>
              <option value="Land">Land</option>
              <option value="Office">Office</option>
              <option value="Warehouse">Warehouse</option>
              <option value="Commercial">Commercial</option>
              <option value="Shop">Shop</option>
              <option value="Restaurant">Restaurant</option>
              <option value="Other">Other (Specify)</option>
            </select>
          </div>
          
          <div class="form-group full-width hidden" id="editCustomTypeGroup">
            <label>Specify Property Type</label>
            <input type="text" name="customType" id="editCustomTypeInput" placeholder="e.g. Co-working Space, Storage Unit, etc.">
          </div>
          
          <div class="form-group">
            <label>Location</label>
            <select name="location" required>
              <option value="Kololo">Kololo</option>
              <option value="Nakasero">Nakasero</option>
              <option value="Naguru">Naguru</option>
              <option value="Bugolobi">Bugolobi</option>
              <option value="Mbuya">Mbuya</option>
              <option value="Kulambiro">Kulambiro</option>
              <option value="Ntinda">Ntinda</option>
              <option value="Muyenga">Muyenga</option>
              <option value="Kampala">Kampala</option>
            </select>
          </div>
          
          <div class="form-group">
            <label>Status</label>
            <select name="status">
              <option value="Active">Active</option>
              <option value="Sold Out">Sold Out</option>
              <option value="Rented">Rented</option>
              <option value="Booked">Booked</option>
            </select>
          </div>
          
          <div class="form-group">
            <label>Currency</label>
            <select name="currency" required>
              <option value="UGX">UGX - Ugandan Shilling</option>
              <option value="USD">USD - US Dollar</option>
              <option value="EUR">EUR - Euro</option>
              <option value="RWF">RWF - Rwandan Franc</option>
              <option value="KES">KES - Kenyan Shilling</option>
            </select>
          </div>
          
          <div class="form-group">
            <label>Price</label>
            <input type="number" name="price" required placeholder="0">
          </div>
          
          <div class="form-group">
            <label>Price Label</label>
            <select name="priceLabel">
              <option value="">Select</option>
              <option value="per night">Per Night</option>
              <option value="per month">Per Month</option>
              <option value="total">Total (Sale)</option>
            </select>
          </div>
          
          <div class="form-group building-only">
            <label>Bedrooms</label>
            <input type="number" name="bedrooms" min="0" placeholder="0">
          </div>
          
          <div class="form-group building-only">
            <label>Bathrooms</label>
            <input type="number" name="bathrooms" min="0" placeholder="0">
          </div>
          
          <div class="form-group">
            <label>Availability Date</label>
            <div class="date-input-group">
              <input type="date" name="availability">
              <button type="button" class="btn-today" onclick="this.previousElementSibling.value = new Date().toISOString().split('T')[0]">
                <i class='bx bx-calendar-check'></i>
              </button>
            </div>
          </div>
          
          <div class="form-group full-width">
            <label>Amenities</label>
            <div class="amenities-grid">
              <label class="checkbox-label">
                <input type="checkbox" name="amenities" value="WiFi">
                <span><i class='bx bx-wifi'></i> WiFi</span>
              </label>
              <label class="checkbox-label">
                <input type="checkbox" name="amenities" value="Smart TV">
                <span><i class='bx bx-tv'></i> Smart TV</span>
              </label>
              <label class="checkbox-label">
                <input type="checkbox" name="amenities" value="DSTV">
                <span><i class='bx bx-tv'></i> DSTV</span>
              </label>
              <label class="checkbox-label">
                <input type="checkbox" name="amenities" value="AC Units">
                <span><i class='bx bx-wind'></i> AC Units</span>
              </label>
              <label class="checkbox-label">
                <input type="checkbox" name="amenities" value="Modern Kitchen">
                <span><i class='bx bx-dish'></i> Kitchen</span>
              </label>
              <label class="checkbox-label">
                <input type="checkbox" name="amenities" value="Parking">
                <span><i class='bx bx-car'></i> Parking</span>
              </label>
              <label class="checkbox-label">
                <input type="checkbox" name="amenities" value="Swimming Pool">
                <span><i class='bx bx-swim'></i> Pool</span>
              </label>
              <label class="checkbox-label">
                <input type="checkbox" name="amenities" value="Gym">
                <span><i class='bx bx-dumbbell'></i> Gym</span>
              </label>
              <label class="checkbox-label">
                <input type="checkbox" name="amenities" value="24/7 Security">
                <span><i class='bx bx-shield'></i> Security</span>
              </label>
              <label class="checkbox-label">
                <input type="checkbox" name="amenities" value="CCTV">
                <span><i class='bx bx-cctv'></i> CCTV</span>
              </label>
              <label class="checkbox-label">
                <input type="checkbox" name="amenities" value="Fully Serviced">
                <span><i class='bx bx-check-circle'></i> Serviced</span>
              </label>
              <label class="checkbox-label">
                <input type="checkbox" name="amenities" value="Fully Furnished">
                <span><i class='bx bx-home-heart'></i> Furnished</span>
              </label>
            </div>
          </div>
          
          <div class="form-group full-width">
            <label>Images</label>
            <div id="modalImagePreviews" class="image-previews"></div>
            <div class="upload-area" onclick="document.getElementById('modalImageInput').click()">
              <i class='bx bx-image-add'></i>
              <p>Click to add more photos</p>
              <input type="file" id="modalImageInput" multiple accept="image/*" style="display:none;">
            </div>
          </div>
          
          <div class="form-group full-width">
            <label>Description</label>
            <textarea name="description" required placeholder="Enter property description..." rows="4"></textarea>
          </div>
        </div>
        
        <div class="modal-footer">
          <button type="button" id="cancelEdit" class="btn-secondary">Cancel</button>
          <button type="submit" id="saveEdit" class="btn-primary">
            <i class='bx bx-save'></i> Save Changes
          </button>
        </div>
      </form>
    </div>
  </div>

</body>
</html>
