<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="googlebot" content="noindex, nofollow">
  <title>Properties | Pixon Admin</title>
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin-dashboard/admin.css">
  <style>
    .filter-bar { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }
    .filter-btn {
      padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--white); font-size: 13px; font-weight: 500; cursor: pointer;
      font-family: inherit; color: var(--text-muted); transition: all 0.2s;
    }
    .filter-btn.active { background: var(--blue); color: #fff; border-color: var(--blue); }
    .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
    .empty-state i { font-size: 48px; margin-bottom: 12px; display: block; }
  </style>
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <img src="../images/pixon-logo.jpeg" alt="Pixon">
      <span>Pixon</span>
    </div>
    <nav class="sidebar-nav">
      <a href="/admin-dashboard/index.html" class="nav-item"><i class='bx bxs-dashboard'></i><span>Dashboard</span></a>
      <a href="/admin-dashboard/properties.html" class="nav-item active"><i class='bx bxs-buildings'></i><span>Properties</span></a>
      <a href="/admin-dashboard/inquiries.html" class="nav-item"><i class='bx bxs-inbox'></i><span>Inquiries</span></a>
      <a href="/admin-dashboard/add-property.html" class="nav-item"><i class='bx bxs-plus-circle'></i><span>Add Property</span></a>
      <a href="/admin-dashboard/settings.html" class="nav-item"><i class='bx bxs-cog'></i><span>Settings</span></a>
    </nav>
    <div class="sidebar-bottom">
      <a href="../index.html" class="nav-item"><i class='bx bx-globe'></i><span>View Site</span></a>
      <a href="#" class="nav-item" id="logoutBtn"><i class='bx bx-log-out'></i><span>Logout</span></a>
    </div>
  </aside>

  <div class="main-wrapper">
    <header class="topbar">
      <div class="topbar-left">
        <button class="menu-toggle" id="menuToggle"><i class='bx bx-menu'></i></button>
        <div>
          <p class="topbar-sub">PIXON REAL ESTATE</p>
          <h2 class="topbar-title">Properties</h2>
        </div>
      </div>
      <div class="topbar-right">
        <div class="admin-profile">
          <div class="avatar"><i class='bx bxs-user'></i></div>
          <div><p class="admin-name">Admin</p><p class="admin-role">Property Manager</p></div>
        </div>
      </div>
    </header>

    <main class="content">
      <div class="filter-bar">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="buy">For Sale</button>
        <button class="filter-btn" data-filter="rent">For Rent</button>
        <button class="filter-btn" data-filter="book">Short Stay</button>
        <div class="search-box" style="margin-left:auto;">
          <i class='bx bx-search'></i>
          <input type="text" id="propSearch" placeholder="Search properties...">
        </div>
        <a href="add-property.html" class="btn-primary">+ Add New</a>
      </div>

      <div class="card" style="padding:0;">
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>Property</th>
                <th>Type</th>
                <th>Category</th>
                <th>Location</th>
                <th>Price</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="propertiesTableBody">
              <tr><td colspan="7" class="loading-row">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script type="module" src="/admin-dashboard/properties.js"></script>
  
  <!-- EDIT MODAL -->
  <div id="editModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:1000; overflow-y:auto;">
    <div style="max-width:800px; margin:40px auto; background:#fff; border-radius:12px; padding:32px;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px;">
        <h2 style="font-size:20px; font-weight:700;">Edit Property</h2>
        <button id="closeModal" style="background:none; border:none; font-size:28px; cursor:pointer; color:#6b7a8d;">&times;</button>
      </div>
      
      <form id="editForm">
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
          <div style="grid-column:1/-1;">
            <label style="display:block; font-size:13px; font-weight:500; margin-bottom:6px;">Title</label>
            <input type="text" name="title" required style="width:100%; padding:10px; border:1px solid #e2e8f0; border-radius:8px; font-size:14px;">
          </div>
          <div>
            <label style="display:block; font-size:13px; font-weight:500; margin-bottom:6px;">Category</label>
            <select name="category" required style="width:100%; padding:10px; border:1px solid #e2e8f0; border-radius:8px; font-size:14px;">
              <option value="buy">For Sale</option>
              <option value="rent">For Rent</option>
              <option value="book">Short Stay</option>
            </select>
          </div>
          <div>
            <label style="display:block; font-size:13px; font-weight:500; margin-bottom:6px;">Type</label>
            <select name="type" required style="width:100%; padding:10px; border:1px solid #e2e8f0; border-radius:8px; font-size:14px;">
              <option value="Apartment">Apartment</option>
              <option value="House">House</option>
              <option value="Penthouse">Penthouse</option>
              <option value="Villa">Villa</option>
              <option value="Land">Land</option>
            </select>
          </div>
          <div>
            <label style="display:block; font-size:13px; font-weight:500; margin-bottom:6px;">Location</label>
            <select name="location" required style="width:100%; padding:10px; border:1px solid #e2e8f0; border-radius:8px; font-size:14px;">
              <option value="Kololo">Kololo</option>
              <option value="Nakasero">Nakasero</option>
              <option value="Naguru">Naguru</option>
              <option value="Bugolobi">Bugolobi</option>
              <option value="Mbuga">Mbuga</option>
              <option value="Kulambiro">Kulambiro</option>
              <option value="Kampala">Kampala</option>
            </select>
          </div>
          <div>
            <label style="display:block; font-size:13px; font-weight:500; margin-bottom:6px;">Price (UGX)</label>
            <input type="number" name="price" required style="width:100%; padding:10px; border:1px solid #e2e8f0; border-radius:8px; font-size:14px;">
          </div>
          <div>
            <label style="display:block; font-size:13px; font-weight:500; margin-bottom:6px;">Status</label>
            <select name="status" style="width:100%; padding:10px; border:1px solid #e2e8f0; border-radius:8px; font-size:14px;">
              <option value="Active">Active</option>
              <option value="Sold Out">Sold Out</option>
              <option value="Rented">Rented</option>
              <option value="Booked">Booked</option>
            </select>
          </div>
          <div>
            <label style="display:block; font-size:13px; font-weight:500; margin-bottom:6px;">Bedrooms</label>
            <input type="number" name="bedrooms" min="0" style="width:100%; padding:10px; border:1px solid #e2e8f0; border-radius:8px; font-size:14px;">
          </div>
          <div style="grid-column:1/-1;">
            <label style="display:block; font-size:13px; font-weight:500; margin-bottom:6px;">Description</label>
            <textarea name="description" required style="width:100%; padding:10px; border:1px solid #e2e8f0; border-radius:8px; font-size:14px; min-height:80px;"></textarea>
          </div>
        </div>
        <div style="display:flex; gap:12px; margin-top:24px; justify-content:flex-end;">
          <button type="button" id="cancelEdit" style="padding:10px 20px; border:1px solid #e2e8f0; background:#fff; border-radius:8px; cursor:pointer; font-weight:600;">Cancel</button>
          <button type="submit" id="saveEdit" style="padding:10px 20px; border:none; background:#286192; color:#fff; border-radius:8px; cursor:pointer; font-weight:600;">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

</body>
</html>
