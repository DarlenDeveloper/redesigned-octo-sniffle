<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="googlebot" content="noindex, nofollow">
  <title>Add Listing | Pixon Admin</title>
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin-dashboard/admin.css">
  <style>
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group.full { grid-column: 1 / -1; }
    label { font-size: 13px; font-weight: 500; color: #1a2332; }
    input, select, textarea {
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 11px 14px;
      font-size: 14px;
      font-family: inherit;
      color: #1a2332;
      outline: none;
      transition: border-color 0.2s;
      background: #fff;
    }
    input:focus, select:focus, textarea:focus { border-color: #286192; }
    textarea { resize: vertical; min-height: 100px; }
    
    /* Progress Steps */
    .progress-steps {
      display: flex;
      justify-content: space-between;
      margin-bottom: 30px;
      position: relative;
    }
    .progress-steps::before {
      content: '';
      position: absolute;
      top: 20px;
      left: 0;
      right: 0;
      height: 2px;
      background: #e2e8f0;
      z-index: 0;
    }
    .step {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      position: relative;
      z-index: 1;
      flex: 1;
    }
    .step-circle {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #f0f4f8;
      color: #6b7a8d;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 16px;
      transition: all 0.3s;
    }
    .step.active .step-circle {
      background: #286192;
      color: white;
    }
    .step.completed .step-circle {
      background: #27ae60;
      color: white;
    }
    .step-label {
      font-size: 12px;
      color: #6b7a8d;
      font-weight: 500;
      text-align: center;
    }
    .step.active .step-label {
      color: #286192;
      font-weight: 600;
    }
    
    /* Form Steps */
    .form-step {
      display: none;
    }
    .form-step.active {
      display: block;
    }
    
    .amenities-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .amenity-check {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      cursor: pointer;
    }
    .amenity-check input { width: auto; padding: 0; }
    .image-upload-area {
      border: 2px dashed #e2e8f0;
      border-radius: 10px;
      padding: 30px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .image-upload-area:hover { border-color: #286192; }
    .image-upload-area i { font-size: 36px; color: #6b7a8d; }
    .image-upload-area p { font-size: 14px; color: #6b7a8d; margin-top: 8px; }
    .image-previews {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 12px;
    }
    .preview-thumb {
      width: 80px; height: 70px;
      border-radius: 8px;
      object-fit: cover;
      border: 1px solid #e2e8f0;
    }
    .form-actions {
      display: flex;
      gap: 12px;
      justify-content: space-between;
      margin-top: 24px;
    }
    .btn-secondary {
      background: #f0f4f8;
      color: #1a2332;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      text-decoration: none;
    }
    .btn-secondary:hover {
      background: #e2e8f0;
    }
    .success-msg {
      background: #e8f8f0;
      color: #27ae60;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 14px;
      margin-bottom: 16px;
      display: none;
    }
    .error-msg {
      background: #fdecea;
      color: #e74c3c;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 14px;
      margin-bottom: 16px;
      display: none;
    }
    .hidden { display: none !important; }
    @media (max-width: 768px) {
      .form-grid { grid-template-columns: 1fr; }
      .form-group.full { grid-column: 1; }
      .amenities-grid { grid-template-columns: 1fr 1fr; }
      .step-label { font-size: 10px; }
    }
  </style>
</head>
<body>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <img src="../images/pixon-logo.jpeg" alt="Pixon">
      <span>Pixon</span>
    </div>
    <nav class="sidebar-nav">
      <a href="/admin-dashboard/index.html" class="nav-item"><i class='bx bxs-dashboard'></i><span>Dashboard</span></a>
      <a href="/admin-dashboard/properties.html" class="nav-item"><i class='bx bx-building-house'></i><span>Listings</span></a>
      <a href="/admin-dashboard/inquiries.html" class="nav-item"><i class='bx bx-envelope'></i><span>Inquiries</span></a>
      <a href="/admin-dashboard/add-property.html" class="nav-item active"><i class='bx bx-plus-circle'></i><span>Add Listing</span></a>
      <a href="/admin-dashboard/settings.html" class="nav-item"><i class='bx bx-cog'></i><span>Settings</span></a>
    </nav>
    <div class="sidebar-bottom">
      <a href="../index.html" class="nav-item"><i class='bx bx-globe'></i><span>View Site</span></a>
      <a href="#" class="nav-item" id="logoutBtn"><i class='bx bx-log-out'></i><span>Logout</span></a>
    </div>
  </aside>

  <div class="main-wrapper">
    <header class="topbar">
      <div class="topbar-left">
        <button class="menu-toggle" id="menuToggle"><i class='bx bx-menu'></i></button>
        <div>
          <p class="topbar-sub">PIXON REAL ESTATE</p>
          <h2 class="topbar-title">Add New Listing</h2>
        </div>
      </div>
      <div class="topbar-right">
        <div class="admin-profile">
          <div class="avatar"><i class='bx bxs-user'></i></div>
          <div>
            <p class="admin-name">Admin</p>
            <p class="admin-role">Property Manager</p>
          </div>
        </div>
      </div>
    </header>

    <main class="content">
      <div class="card" style="max-width: 900px;">
        <div class="success-msg" id="successMsg">Property added successfully!</div>
        <div class="error-msg" id="errorMsg"></div>

        <!-- Progress Steps -->
        <div class="progress-steps">
          <div class="step active" data-step="1">
            <div class="step-circle">1</div>
            <div class="step-label">Basic Info</div>
          </div>
          <div class="step" data-step="2">
            <div class="step-circle">2</div>
            <div class="step-label">Property Details</div>
          </div>
          <div class="step" data-step="3">
            <div class="step-circle">3</div>
            <div class="step-label">Amenities</div>
          </div>
          <div class="step" data-step="4">
            <div class="step-circle">4</div>
            <div class="step-label">Images & Finish</div>
          </div>
        </div>

        <form id="addPropertyForm">
          
          <!-- STEP 1: Basic Info -->
          <div class="form-step active" data-step="1">
            <div class="form-grid">
              <div class="form-group full">
                <label>Property Title *</label>
                <input type="text" name="title" placeholder="e.g. Kololo Executive Apartment" required>
              </div>

              <div class="form-group">
                <label>Category *</label>
                <select name="category" id="categorySelect" required>
                  <option value="">Select category</option>
                  <option value="buy">For Sale (Buy)</option>
                  <option value="rent">For Rent</option>
                  <option value="book">Short Stay (Book)</option>
                </select>
              </div>

              <div class="form-group">
                <label>Property Type *</label>
                <select name="type" id="typeSelect" required>
                  <option value="">Select type</option>
                  <option value="Apartment">Apartment</option>
                  <option value="House">House</option>
                  <option value="Penthouse">Penthouse</option>
                  <option value="Villa">Villa</option>
                  <option value="Hotel">Hotel</option>
                  <option value="Land">Land</option>
                  <option value="Office">Office</option>
                  <option value="Warehouse">Warehouse</option>
                  <option value="Commercial">Commercial</option>
                  <option value="Shop">Shop</option>
                  <option value="Restaurant">Restaurant</option>
                  <option value="Other">Other (Specify)</option>
                </select>
              </div>

              <div class="form-group hidden" id="customTypeGroup" style="grid-column: 1 / -1;">
                <label>Specify Property Type *</label>
                <input type="text" name="customType" id="customTypeInput" placeholder="e.g. Co-working Space, Storage Unit, etc.">
              </div>

              <div class="form-group">
                <label>Location *</label>
                <select name="location" required>
                  <option value="">Select location</option>
                  <option value="Kololo">Kololo</option>
                  <option value="Nakasero">Nakasero</option>
                  <option value="Naguru">Naguru</option>
                  <option value="Bugolobi">Bugolobi</option>
                  <option value="Mbuga">Mbuga</option>
                  <option value="Kulambiro">Kulambiro</option>
                  <option value="Ntinda">Ntinda</option>
                  <option value="Muyenga">Muyenga</option>
                  <option value="Kampala">Kampala</option>
                </select>
              </div>

              <div class="form-group">
                <label>Status *</label>
                <select name="status" required>
                  <option value="">Select status</option>
                  <option value="Active">Active</option>
                  <option value="Sold Out">Sold Out</option>
                  <option value="Rented">Rented</option>
                  <option value="Booked">Booked</option>
                </select>
              </div>
            </div>
          </div>

          <!-- STEP 2: Property Details -->
          <div class="form-step" data-step="2">
            <div class="form-grid">
              
              <!-- For Land -->
              <div class="form-group land-only hidden">
                <label>Land Size (Acres)</label>
                <input type="number" name="landSizeAcres" placeholder="e.g. 2.5" step="0.01">
              </div>

              <div class="form-group land-only hidden">
                <label>Land Size (Sq Meters)</label>
                <input type="number" name="landSizeSqm" placeholder="e.g. 10000">
              </div>

              <div class="form-group land-only hidden">
                <label>Title Deed Status</label>
                <select name="titleDeed">
                  <option value="Available">Available</option>
                  <option value="Pending">Pending</option>
                  <option value="Leasehold">Leasehold</option>
                  <option value="Freehold">Freehold</option>
                </select>
              </div>

              <!-- For Buildings (Not Land) -->
              <div class="form-group building-only">
                <label>Bedrooms</label>
                <input type="number" name="bedrooms" placeholder="e.g. 3" min="0">
              </div>

              <div class="form-group building-only">
                <label>Bathrooms</label>
                <input type="number" name="bathrooms" placeholder="e.g. 2" min="0">
              </div>

              <div class="form-group building-only">
                <label>Floor Area (Sq Meters)</label>
                <input type="number" name="floorArea" placeholder="e.g. 120">
              </div>

              <!-- Pricing -->
              <div class="form-group">
                <label>Currency *</label>
                <select name="currency" required>
                  <option value="UGX">UGX - Ugandan Shilling</option>
                  <option value="USD">USD - US Dollar</option>
                  <option value="EUR">EUR - Euro</option>
                  <option value="RWF">RWF - Rwandan Franc</option>
                  <option value="KES">KES - Kenyan Shilling</option>
                </select>
              </div>

              <div class="form-group">
                <label id="priceLabel">Price *</label>
                <input type="number" name="price" placeholder="e.g. 1500000" required>
              </div>

              <div class="form-group">
                <label>Price Label</label>
                <select name="priceLabel" id="priceLabelSelect">
                  <option value="">Select</option>
                  <option value="per night">Per Night</option>
                  <option value="per month">Per Month</option>
                  <option value="total">Total (Sale)</option>
                </select>
              </div>

              <!-- For Rent -->
              <div class="form-group rent-only hidden">
                <label>Security Deposit (UGX)</label>
                <input type="number" name="deposit" placeholder="e.g. 3000000">
              </div>

              <div class="form-group rent-only hidden">
                <label>Utilities Included</label>
                <select name="utilitiesIncluded">
                  <option value="No">No</option>
                  <option value="Yes">Yes</option>
                  <option value="Partial">Partial</option>
                </select>
              </div>

              <!-- For Book -->
              <div class="form-group book-only hidden">
                <label>Minimum Stay (Nights)</label>
                <input type="number" name="minStay" placeholder="e.g. 2" min="1">
              </div>

              <div class="form-group book-only hidden">
                <label>Check-in Time</label>
                <input type="time" name="checkInTime" value="14:00">
              </div>

              <div class="form-group book-only hidden">
                <label>Check-out Time</label>
                <input type="time" name="checkOutTime" value="11:00">
              </div>

              <div class="form-group">
                <label>Availability Date *</label>
                <div style="display:flex; gap:8px;">
                  <input type="date" name="availability" id="availInput" style="flex:1;" required>
                  <button type="button" class="btn-primary" style="padding: 8px 12px; background: #27ae60;" onclick="document.getElementById('availInput').value = new Date().toISOString().split('T')[0]">Today</button>
                </div>
              </div>

              <div class="form-group full">
                <label>Description *</label>
                <textarea name="description" placeholder="Describe the property..." required></textarea>
              </div>
            </div>
          </div>

          <!-- STEP 3: Amenities -->
          <div class="form-step" data-step="3">
            <div class="form-group full">
              <label>Select Amenities * (At least one required)</label>
              <div class="amenities-grid">
                <label class="amenity-check"><input type="checkbox" name="amenities" value="WiFi"> WiFi</label>
                <label class="amenity-check"><input type="checkbox" name="amenities" value="Smart TV"> Smart TV</label>
                <label class="amenity-check"><input type="checkbox" name="amenities" value="DSTV"> DSTV/Cable</label>
                <label class="amenity-check"><input type="checkbox" name="amenities" value="AC Units"> AC Units</label>
                <label class="amenity-check"><input type="checkbox" name="amenities" value="Modern Kitchen"> Modern Kitchen</label>
                <label class="amenity-check"><input type="checkbox" name="amenities" value="Washing Machine"> Washing Machine</label>
                <label class="amenity-check"><input type="checkbox" name="amenities" value="Solar Backup"> Solar Backup</label>
                <label class="amenity-check"><input type="checkbox" name="amenities" value="Generator"> Generator</label>
                <label class="amenity-check"><input type="checkbox" name="amenities" value="Water Tank"> Water Tank</label>
                <label class="amenity-check"><input type="checkbox" name="amenities" value="Borehole"> Borehole</label>
                <label class="amenity-check"><input type="checkbox" name="amenities" value="Warm Water"> Hot Water</label>
                <label class="amenity-check"><input type="checkbox" name="amenities" value="Parking"> Parking</label>
                <label class="amenity-check"><input type="checkbox" name="amenities" value="24/7 Security"> 24/7 Security</label>
                <label class="amenity-check"><input type="checkbox" name="amenities" value="CCTV"> CCTV</label>
                <label class="amenity-check"><input type="checkbox" name="amenities" value="Gated Community"> Gated Community</label>
                <label class="amenity-check"><input type="checkbox" name="amenities" value="Swimming Pool"> Swimming Pool</label>
                <label class="amenity-check"><input type="checkbox" name="amenities" value="Gym"> Gym</label>
                <label class="amenity-check"><input type="checkbox" name="amenities" value="Elevator"> Elevator</label>
                <label class="amenity-check"><input type="checkbox" name="amenities" value="Balcony"> Balcony/Terrace</label>
                <label class="amenity-check"><input type="checkbox" name="amenities" value="Garden"> Garden</label>
                <label class="amenity-check"><input type="checkbox" name="amenities" value="Study Room"> Study Room</label>
                <label class="amenity-check"><input type="checkbox" name="amenities" value="Servant Quarters"> Servant Quarters</label>
                <label class="amenity-check"><input type="checkbox" name="amenities" value="Fully Serviced"> Fully Serviced</label>
                <label class="amenity-check"><input type="checkbox" name="amenities" value="Fully Furnished"> Fully Furnished</label>
              </div>
            </div>
          </div>

          <!-- STEP 4: Images -->
          <div class="form-step" data-step="4">
            <div class="form-group full">
              <label>Property Images * (At least one required)</label>
              <div class="image-upload-area" id="uploadArea">
                <i class='bx bx-image-add'></i>
                <p>Click to upload images or drag & drop</p>
                <input type="file" id="imageInput" multiple accept="image/*" style="display:none">
              </div>
              <div class="image-previews" id="imagePreviews"></div>
            </div>
          </div>

          <!-- Navigation Buttons -->
          <div class="form-actions">
            <div>
              <button type="button" class="btn-secondary" id="prevBtn" style="display:none;">Previous</button>
            </div>
            <div style="display:flex; gap:12px;">
              <a href="/admin-dashboard/index.html" class="btn-secondary">Cancel</a>
              <button type="button" class="btn-primary" id="nextBtn">Next</button>
              <button type="submit" class="btn-primary" id="submitBtn" style="display:none;">Add Property</button>
            </div>
          </div>
        </form>
      </div>
    </main>
  </div>

  <script type="module" src="/admin-dashboard/add-property.js"></script>
</body>
</html>
