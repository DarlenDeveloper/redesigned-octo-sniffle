<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="googlebot" content="noindex, nofollow">
  <title>Admin Login | Pixon</title>
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-card {
      background: #fff;
      border-radius: 16px;
      padding: 48px 40px;
      width: 100%;
      max-width: 420px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 4px 24px rgba(0,0,0,0.06);
    }
    .login-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
    }
    .login-logo img {
      width: 44px; height: 44px;
      border-radius: 10px;
      object-fit: cover;
    }
    .login-logo span {
      font-size: 20px;
      font-weight: 700;
      color: #286192;
    }
    h2 { font-size: 24px; font-weight: 700; margin-bottom: 6px; }
    .subtitle { font-size: 14px; color: #6b7a8d; margin-bottom: 32px; }
    .form-group { margin-bottom: 18px; }
    label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; color: #1a2332; }
    .input-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 12px 14px;
      transition: border-color 0.2s;
    }
    .input-wrap:focus-within { border-color: #286192; }
    .input-wrap i { font-size: 20px; color: #6b7a8d; }
    .input-wrap input {
      border: none;
      outline: none;
      font-size: 14px;
      width: 100%;
      font-family: inherit;
      color: #1a2332;
    }
    .btn-login {
      width: 100%;
      background: #286192;
      color: #fff;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s;
      font-family: inherit;
    }
    .btn-login:hover { background: #1d4a6e; }
    .btn-login:disabled { opacity: 0.6; cursor: not-allowed; }
    .error-msg {
      background: #fdecea;
      color: #e74c3c;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }
    .back-link {
      display: block;
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: #6b7a8d;
      text-decoration: none;
    }
    .back-link:hover { color: #286192; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-logo">
      <img src="../images/pixon-logo.jpeg" alt="Pixon">
      <span>Pixon Admin</span>
    </div>
    <h2>Welcome back</h2>
    <p class="subtitle">Sign in to manage your properties</p>

    <div class="error-msg" id="errorMsg"></div>

    <form id="loginForm">
      <div class="form-group">
        <label>Email</label>
        <div class="input-wrap">
          <i class='bx bx-envelope'></i>
          <input type="email" id="email" placeholder="admin@pixonrealestate.com" required>
        </div>
      </div>
      <div class="form-group">
        <label>Password</label>
        <div class="input-wrap">
          <i class='bx bx-lock-alt'></i>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>
      </div>
      <button type="submit" class="btn-login" id="loginBtn">Sign In</button>
    </form>
    <a href="../index.html" class="back-link">← Back to website</a>
  </div>

  <script type="module" src="/admin-dashboard/login.js"></script>
</body>
</html>
